name: ctf-download-server
services:
  files:
    image: python:3.13-alpine
    restart: unless-stopped
    command: ["python", "-m", "http.server", "8090", "--bind", "0.0.0.0", "--directory", "/downloads"]
    user: "65534:65534"
    ports:
      - "8090:8090"
    volumes:
      - ../releases:/downloads:ro
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 32
    mem_limit: 64m
