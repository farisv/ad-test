name: attack-defense-lab

x-hardening: &hardening
  restart: unless-stopped
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 128
  mem_limit: 256m
  networks: [arena]

services:
  web-php:
    <<: *hardening
    build: ./web-php
    ports: ["8081:8081"]
    volumes: [php-data:/data]

  web-go:
    <<: *hardening
    build: ./web-go
    ports: ["8082:8082"]
    volumes: [go-data:/data]

  web-node:
    <<: *hardening
    build: ./web-node
    ports: ["8083:8083"]
    volumes: [node-data:/data]

  web-java:
    <<: *hardening
    build: ./web-java
    ports: ["8084:8084"]
    volumes: [java-data:/data]

  bin-socat:
    <<: *hardening
    build: ./bin-socat
    ports: ["9001:9001"]
    volumes: [socat-data:/data]

  bin-socket:
    <<: *hardening
    build: ./bin-socket
    ports: ["9002:9002"]
    volumes: [socket-data:/data]

  checker:
    build: ./checker
    restart: unless-stopped
    depends_on: [web-php, web-go, web-node, web-java, bin-socat, bin-socket]
    environment:
      CHECK_INTERVAL: ${CHECK_INTERVAL:-60}
    volumes: [checker-state:/state]
    networks: [arena]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m

networks:
  arena: {}

volumes:
  php-data:
  go-data:
  node-data:
  java-data:
  socat-data:
  socket-data:
  checker-state:
