<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CTF Checker Simulator</title>
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,sans-serif;background:#071019;color:#e6edf3}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1180px;margin:auto;padding:32px 20px 80px}h1{margin:0;font-size:clamp(28px,4vw,46px);letter-spacing:-.04em}.sub{color:#8fa3b8;margin:8px 0 24px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}.meta{display:flex;gap:10px;flex-wrap:wrap}.pill{background:#101d29;border:1px solid #26394b;border-radius:999px;padding:7px 11px;color:#b8c9d8;font-size:14px}button{border:0;border-radius:9px;background:#54d2a0;color:#04150f;padding:11px 16px;font-weight:750;cursor:pointer}button:disabled{opacity:.45;cursor:wait}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:12px;margin:24px 0}.card{background:#0d1924;border:1px solid #243747;border-radius:14px;padding:17px}.card h2{font-size:17px;margin:0 0 4px}.kind{color:#7992a8;font-size:13px}.states{display:flex;gap:8px;margin-top:18px}.state{border-radius:7px;padding:6px 9px;font-size:12px;font-weight:800}.up,.blocked{background:#123b2e;color:#72e6b4}.down,.stolen{background:#4b1e26;color:#ff9ba9}.unknown{background:#263442;color:#9fb1c1}h3{margin-top:34px}.tablebox{overflow:auto;border:1px solid #243747;border-radius:14px}table{width:100%;border-collapse:collapse;min-width:790px;background:#0d1924}th,td{text-align:left;padding:12px;border-bottom:1px solid #1d2d3b;font-size:13px}th{color:#8fa3b8;font-weight:600}.details td{padding:0 12px 18px;color:#aebfce}.error{color:#ff9ba9;white-space:pre-wrap}.flaggroup{margin:8px 0 13px}.flaggroup strong{display:block;color:#dce8f2;margin-bottom:5px}.flags{display:flex;flex-wrap:wrap;gap:5px}.flags code{background:#071019;border:1px solid #26394b;border-radius:5px;padding:4px 7px;color:#ffc875;overflow-wrap:anywhere}.empty{text-align:center;color:#8fa3b8;padding:40px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:#54d2a0}.running .dot{animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.25}}
</style></head><body><div class="wrap">
<div class="top"><div><h1>CTF Checker Simulator</h1><p class="sub">SLA placement and offensive flag-recovery history</p></div><button id="run">Run tick now</button></div>
<div class="meta"><span class="pill" id="target">Target …</span><span class="pill" id="clock">Loading …</span><span class="pill" id="runtime"><span class="dot"></span>Waiting</span></div>
<section class="grid" id="cards"></section>
<h3>Tick history</h3><div class="tablebox"><table><thead><tr><th>Tick</th><th>Time</th><th>Duration</th><th>SLA</th><th>Flags stolen</th><th>Details</th></tr></thead><tbody id="history"><tr><td colspan="6" class="empty">Waiting for first tick…</td></tr></tbody></table></div>
</div><script src="/app.js"></script></body></html>
